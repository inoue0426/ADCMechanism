[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adcmechanism"
version = "0.1.0"
description = "Mechanism-aware ADC response modeling experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
